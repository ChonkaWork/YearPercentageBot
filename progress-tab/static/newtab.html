<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New Tab</title>
    <link rel="preload" href="fonts/manrope-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/jetbrains-mono-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="newtab.css" />
    <!-- Applies the saved theme before the first paint, then renders on DOMContentLoaded. -->
    <script src="newtab.js"></script>
  </head>
  <body>
    <div class="app">
      <div class="topbar">
        <button id="open-settings" class="btn-icon settings-toggle" type="button" aria-label="Settings" title="Settings" aria-expanded="false" aria-controls="settings">
          <span data-icon="gear"></span>
        </button>
      </div>

      <main id="page" class="page">
        <div id="page-alert" class="alert alert-danger page-alert alert-with-icon" role="alert" hidden></div>

        <section id="clock" class="clock" aria-label="Current time and date">
          <p id="clock-time" class="clock-time"></p>
          <p id="clock-date" class="clock-date"></p>
        </section>

        <div class="layout">
          <section id="periods" class="card periods" aria-label="Time progress">
            <ul id="period-list" class="list-group list-group-flush"></ul>
          </section>

          <section id="countdowns" class="card countdowns" aria-labelledby="countdowns-title">
            <div class="card-header">
              <h2 id="countdowns-title" class="section-label">Countdowns</h2>
              <button id="add-countdown" class="btn btn-primary btn-sm" type="button" hidden><span data-icon="plusLg"></span> Add</button>
            </div>
            <div id="countdown-body"></div>
          </section>
        </div>

        <div id="nothing-shown" class="card nothing-shown" hidden>
          <p>Everything is hidden.</p>
          <button id="show-settings" class="btn btn-primary btn-sm" type="button">Choose what to show</button>
        </div>
      </main>
    </div>

    <aside id="settings" class="drawer" role="dialog" aria-labelledby="settings-title" tabindex="-1">
      <div class="drawer-header">
        <h2 id="settings-title">Settings</h2>
        <span id="save-status" class="save-status" role="status" aria-live="polite"></span>
        <button id="close-settings" class="btn-close" type="button" aria-label="Close settings"></button>
      </div>
      <div class="drawer-body">
        <div id="settings-error" class="alert alert-danger alert-with-icon" role="alert" hidden></div>

        <fieldset class="setting">
          <legend class="section-label">Show</legend>
          <div id="widget-switches" class="switch-grid"></div>
        </fieldset>

        <fieldset class="setting">
          <legend class="section-label">Week starts on</legend>
          <div id="week-start"></div>
        </fieldset>

        <fieldset class="setting">
          <legend class="section-label">Time format</legend>
          <div id="clock-format"></div>
        </fieldset>

        <div class="setting">
          <label class="section-label setting-label" for="decimals">Percent decimals</label>
          <select id="decimals" class="form-select form-select-sm"></select>
        </div>

        <fieldset class="setting">
          <legend class="section-label">Theme</legend>
          <div id="theme"></div>
        </fieldset>

        <fieldset class="setting">
          <legend class="section-label">Accent</legend>
          <div id="accent" class="swatches"></div>
        </fieldset>

        <div class="drawer-footer">
          <span data-icon="shieldCheck"></span>
          <p>Settings and countdowns stay in this browser. No account, no tracking, no network requests.</p>
        </div>
      </div>
    </aside>

    <div class="toast-region" aria-live="polite" aria-atomic="true">
      <div id="toast" class="toast">
        <div class="toast-content">
          <span id="toast-text" class="toast-text"></span>
          <button id="toast-action" class="btn btn-link btn-sm fw-semibold" type="button" hidden></button>
          <button id="toast-close" class="btn-close" type="button" aria-label="Dismiss"></button>
        </div>
      </div>
    </div>
  </body>
</html>
