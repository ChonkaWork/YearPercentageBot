<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>New message</title>
    <style>
      body { margin: 0; background: #f3f4f6; font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #1f2937; }
      .window { width: 640px; margin: 32px auto; background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.08); overflow: hidden; }
      .bar { padding: 12px 18px; background: #f9fafb; border-bottom: 1px solid #e5e7eb; font-weight: 600; }
      .row { display: flex; align-items: center; gap: 12px; padding: 8px 18px; border-bottom: 1px solid #f0f0f0; }
      .row span { width: 64px; color: #6b7280; }
      .row input { flex: 1; border: 0; font: inherit; padding: 4px 0; outline: none; }
      textarea { display: block; width: 100%; box-sizing: border-box; height: 230px; border: 0; padding: 14px 18px; font: inherit; resize: none; outline: none; }
      .actions { padding: 12px 18px; border-top: 1px solid #f0f0f0; }
      button { background: #2563eb; color: #fff; border: 0; border-radius: 8px; padding: 8px 16px; font: inherit; font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="window">
      <div class="bar">New message</div>
      <label class="row"><span>To</span><input id="to" type="email" value="sam@example.com" /></label>
      <label class="row"><span>Subject</span><input id="subject" type="text" /></label>
      <textarea id="body" aria-label="Message"></textarea>
      <div class="actions"><button type="button">Send</button></div>
    </div>
  </body>
</html>
